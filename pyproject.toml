[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "c1"
version = "0.0.0.dev0"
description = "C1 canonical knowledge model and development harness"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
  "pydantic==2.13.5",
  "rdflib==7.6.0",
  "pyshacl==0.40.1",
  "httpx==0.28.1",
  "fastapi==0.141.1",
  "starlette==1.7.0",
  "uvicorn==0.54.0",
  "PyJWT[crypto]==2.15.0",
  "cryptography==50.0.1",
]

[dependency-groups]
dev = [
  "detect-secrets==1.5.0",
  "mypy==2.3.1",
  "pytest==9.0.2",
  "ruff==0.16.9",
  "httpx==0.28.1",
  "openfga-sdk==0.10.4",
  "rdflib==7.6.0",
  "pyshacl==0.40.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/c1"]

[tool.hatch.build.targets.wheel.force-include]
"profiles/core" = "c1/profiles/core"
"profiles/available/example-vehicle" = "c1/profiles/available/example-vehicle"
"profiles/available/example-vehicle-v2-incompatible" = "c1/profiles/available/example-vehicle-v2-incompatible"
"profiles/available/identity" = "c1/profiles/available/identity"
"profiles/available/directory" = "c1/profiles/available/directory"
"profiles/available/topics" = "c1/profiles/available/topics"
"profiles/available/batteries" = "c1/profiles/available/batteries"
"profiles/available/software" = "c1/profiles/available/software"
"profiles/context" = "c1/profiles/context"
"deployment/openfga/c1-v1.json" = "c1/authorization/c1-v1.json"

[tool.uv]
# Isolated PEP 517 build requirements are separate from uv.lock's dev group.
build-constraint-dependencies = [
  "hatchling==1.27.0",
  "editables==0.6",
  "packaging==26.3",
  "pathspec==1.1.1",
  "pluggy==1.6.0",
  "trove-classifiers==2026.9.21.13",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".uv-cache", ".uv-python", "fixtures/software-integration/repos", "fixtures/software-integration/consumer"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
explicit_package_bases = true
mypy_path = ["src", "."]
files = ["src", "scripts", "probes", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
markers = ["integration: requires the isolated real M01 stack (C1_STACK=1)"]
