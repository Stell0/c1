name: Development checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      canary_fail:
        description: Deliberately fail M00-T03 to verify the CI failure path
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      C1_HARNESS_CANARY_FAIL: ${{ inputs.canary_fail && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.2"
          enable-cache: false
      - run: make bootstrap
      - run: make check
